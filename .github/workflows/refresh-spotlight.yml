
name: Refresh Nightfall Horror

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch horror catalog from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.key }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.TMDB_API_KEY;

          if (!key) throw new Error("Missing secret: key");

          const today = new Date().toISOString().slice(0, 10);
          const yearAgo = new Date(Date.now() - 365 * 86400000)
            .toISOString().slice(0, 10);

          async function tmdb(path, params = {}) {
            const query = new URLSearchParams({
              api_key: key,
              language: "en-US",
              ...params
            });

            const response = await fetch(
              `https://api.themoviedb.org/3/${path}?${query}`
            );

            if (!response.ok) {
              throw new Error(`TMDB ${path}: ${response.status}`);
            }

            return response.json();
          }

          async function getHorrorKeyword() {
            const data = await tmdb("search/keyword", {
              query: "horror"
            });

            const match = (data.results || []).find(
              item => item.name.toLowerCase() === "horror"
            );

            if (!match) throw new Error("Horror keyword not found");
            return match.id;
          }

          async function discover(type, params) {
            const data = await tmdb(`discover/${type}`, {
              include_adult: "false",
              page: "1",
              ...params
            });

            return data.results || [];
          }

          function convert(item, section, index, type) {
            const date = item.release_date || item.first_air_date || "";
            const image = item.poster_path || item.backdrop_path;

            const genres = {
              27: "Horror",
              53: "Thriller",
              878: "Sci-Fi",
              9648: "Mystery",
              14: "Fantasy",
              80: "Crime"
            };

            const genre = (item.genre_ids || [])
              .map(id => genres[id])
              .filter(Boolean)
              .slice(0, 2)
              .join(" / ") || "Horror";

            return {
              id: index + 1,
              tmdbId: item.id,
              title: item.title || item.name,
              year: date ? date.slice(0, 4) : "Unknown",
              type: type === "tv" ? "TV" : "Movie",
              genre,
              rating: Number(item.vote_average || 0).toFixed(1),
              tagline: item.overview || "Discover this horror title.",
              detail: item.overview || "Discover this horror title.",
              background: image
                ? `linear-gradient(rgba(10,5,10,.25), rgba(10,5,10,.7)), url('https://image.tmdb.org/t/p/w500${image}') center/cover`
                : "linear-gradient(135deg, #32151d, #09090d)",
              section
            };
          }

          async function main() {
            const horrorKeyword = await getHorrorKeyword();

            const [newMovies, popularMovies, tvShows, classics] =
              await Promise.all([
                discover("movie", {
                  with_genres: "27",
                  "primary_release_date.gte": yearAgo,
                  "primary_release_date.lte": today,
                  sort_by: "popularity.desc"
                }),

                discover("movie", {
                  with_genres: "27",
                  "vote_count.gte": "100",
                  sort_by: "popularity.desc"
                }),

                discover("tv", {
                  with_keywords: String(horrorKeyword),
                  sort_by: "popularity.desc"
                }),

                discover("movie", {
                  with_genres: "27",
                  "primary_release_date.lte": "2005-12-31",
                  "vote_count.gte": "100",
                  sort_by: "vote_average.desc"
                })
              ]);

            const sections = {
              new: newMovies.slice(0, 10).map(
                (item, i) => convert(item, "new", i + 1, "movie")
              ),
              kills: popularMovies.slice(0, 10).map(
                (item, i) => convert(item, "kills", i + 11, "movie")
              ),
              tv: tvShows.slice(0, 10).map(
                (item, i) => convert(item, "tv", i + 21, "tv")
              ),
              classics: classics.slice(0, 10).map(
                (item, i) => convert(item, "classics", i + 31, "movie")
              )
            };

            for (const [name, items] of Object.entries(sections)) {
              if (!items.length) {
                throw new Error(`TMDB returned no titles for ${name}`);
              }
              console.log(`${name}: ${items.length} titles`);
            }

            const items = Object.values(sections).flat();

            fs.writeFileSync(
              "catalog.json",
              JSON.stringify({
                generated_at: new Date().toISOString(),
                sections,
                items
              }, null, 2) + "\n"
            );

            const day = Math.floor(Date.now() / 86400000);
            const spotlight = items[day % items.length];

            const spotlightData = await tmdb(
              `${spotlight.type === "TV" ? "tv" : "movie"}/${spotlight.tmdbId}`
            );

            spotlightData.media_type =
              spotlight.type === "TV" ? "tv" : "movie";

            fs.writeFileSync(
              "spotlight.json",
              JSON.stringify(spotlightData, null, 2) + "\n"
            );

            console.log("Daily spotlight:", spotlight.title);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save updated catalog and spotlight
        run: |
          git add catalog.json spotlight.json

          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Refresh Nightfall horror catalog"
          git push
